<body>
    <div class=".container">
        <h1>SUM OF TWO VARIABLES</h1>
        <form><div class="mb-3">
            <label class="form-label" for="inputFirstName">First Name:</label>
            <input type="number" id="num1">
            <label class="form-label" for="inputSecondName">Second Name:</label>
            <input type="number" id="num2"> 
            <p id="result"> the sum of the two varbiables</p>
        </div>
        <!--CALCULATE-->
        <button type="button" 
                class="btn btn-success"
                onclick="plus()">
                Calculate
        </button>
        <!--REFLESHING-->
        <button type="button" 
        class="btn btn-success" 
        onclick="window.location.reload()">Refresh Page
    </button>
        <script>
               function plus(){
                    var var1 = Number(document.getElementById("num1").value);
                    var var2 = Number(document.getElementById("num2").value);
                    var sum = var1 + var2;
                    document.getElementById("result").innerHTML="The sum: " + sum

            }
        </script>
